<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://*.supabase.co https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:;">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="no-referrer">
  <title>رجّعها | منصة التحويلات الخاطئة</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #c93b2b;
      --primary-hover: #b03224;
      --primary-glow: rgba(201, 59, 43, 0.25);
      --bg-page: #0b0f19;
      --bg-card: #151d30;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #2d3748;
      --input-bg: #0b0f19;
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.2);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'IBM Plex Sans Arabic', sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 32px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      animation: pageEntrance 0.6s var(--ease) forwards;
    }

    @keyframes pageEntrance {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      text-shadow: 0 0 20px var(--primary-glow);
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
      position: relative;
    }

    .tab-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding-bottom: 14px;
    }

    .tab-title {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-main);
    }

    /* صندوق رفع الإيصال المطور حركياً */
    .ocr-box {
      border: 2px dashed #475569;
      border-radius: 12px;
      padding: 22px 16px;
      text-align: center;
      background: rgba(11, 15, 25, 0.55);
      margin-bottom: 22px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s var(--ease);
    }

    .ocr-box:hover, .ocr-box.dragover {
      border-color: var(--primary);
      background: rgba(201, 59, 43, 0.05);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px var(--primary-glow);
    }

    .ocr-box input[type="file"] {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .ocr-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .ocr-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    /* شريط تقدم الفحص */
    .ocr-progress-wrap {
      display: none;
      margin-top: 14px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
      position: relative;
    }

    .ocr-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--primary), #ef4444);
      border-radius: 99px;
      transition: width 0.3s var(--ease);
    }

    .ocr-status {
      display: none;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 600;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ocr-status.processing {
      display: flex;
      color: #f59e0b;
      animation: pulseText 1.5s infinite;
    }

    .ocr-status.success {
      display: flex;
      color: var(--success);
      animation: popIn 0.35s var(--ease);
    }

    .ocr-status.error {
      display: flex;
      color: #ef4444;
      animation: popIn 0.35s var(--ease);
    }

    @keyframes pulseText {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #cbd5e1;
    }

    input, select {
      width: 100%;
      padding: 13px 15px;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    /* زر التسجيل مع مؤشر التحميل الدوار */
    .btn-submit {
      width: 100%;
      padding: 14px;
      background: var(--primary);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s var(--ease), transform 0.15s;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* تنبيهات النظام الحركية */
    .alert {
      padding: 13px 16px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.5;
      margin-bottom: 18px;
      display: none;
      animation: slideDown 0.35s var(--ease);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }

    .alert-success {
      background: var(--success-glow);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #6ee7b7;
    }

    .footer {
      margin-top: 26px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>رجّعها</h1>
      <p>منصة وسيطة مستقلة لإرجاع التحويلات الخاطئة</p>
    </div>

    <div class="card">
      <div class="tab-header">
        <span class="tab-title">بلاغ عن تحويل بالخطأ (مُرسل)</span>
      </div>

      <div id="errorAlert" class="alert alert-error"></div>
      <div id="successAlert" class="alert alert-success"></div>

      <!-- صندوق رفع الإيصال التفاعلي -->
      <div class="ocr-box" id="ocrBox">
        <input type="file" id="receiptUpload" accept="image/png, image/jpeg, image/jpg">
        <div class="ocr-title">فحص وتعبئة آلية عبر الإيصال</div>
        <div class="ocr-subtitle" id="ocrSub">اسحب صورة الإيصال هنا أو اضغط للاختيار (PNG/JPG)</div>
        <div class="ocr-progress-wrap" id="ocrProgressWrap">
          <div class="ocr-progress-bar" id="ocrProgressBar"></div>
        </div>
        <div id="ocrStatus" class="ocr-status"></div>
      </div>

      <form id="reportForm">
        <div class="form-group">
          <label>البنك أو المحفظة</label>
          <select id="bankName" required>
            <option value="بنكك (بنك الخرطوم)">بنكك (بنك الخرطوم)</option>
            <option value="أو كاش (بنك أمدرمان الوطني)">أو كاش (بنك أمدرمان الوطني)</option>
            <option value="فوري (بنك فيصل)">فوري (بنك فيصل)</option>
            <option value="برافو (Bravo)">برافو (Bravo)</option>
            <option value="المشرق (Blue Nile Mashreg)">المشرق (Blue Nile Mashreg)</option>
          </select>
        </div>

        <div class="form-group">
          <label>الرقم المرجعي للعملية (Ref ID / TRX)</label>
          <input type="text" id="refId" placeholder="مثال: 21141403837" required>
        </div>

        <div class="form-group">
          <label>المبلغ بالجنيه بدقة</label>
          <input type="number" id="amount" step="any" placeholder="مثال: 10000" required>
        </div>

        <div class="form-group">
          <label>تاريخ المعاملة</label>
          <input type="date" id="txDate" required>
        </div>

        <div class="form-group">
          <label>رقم هاتف للتواصل (واتساب)</label>
          <input type="tel" id="contactPhone" placeholder="09xxxxxxxx أو 01xxxxxxxx" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">تسجيل وتأكيد البلاغ</span>
        </button>
      </form>
    </div>

    <div class="footer">
      رجّعها © 2026 – منصة وسيطة مستقلة لإرجاع التحويلات الخاطئة.
    </div>
  </div>

  <script>
    // بيانات الاتصال بقاعدة البيانات
    const SUPABASE_URL = "https://cdxystrudncncrppmxjp.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkeHlzdHJ1ZG5jbmNycHBteGpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI2NzE5OTMsImV4cCI6MjA3ODI0Nzk5M30.b3B6X68u5u87Jb_Oq0O61_87yHqE7e1m-t48gA6aE_w";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const dateInput = document.getElementById('txDate');
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    const receiptInput = document.getElementById('receiptUpload');
    const ocrBox = document.getElementById('ocrBox');
    const ocrStatus = document.getElementById('ocrStatus');
    const ocrSub = document.getElementById('ocrSub');
    const progressWrap = document.getElementById('ocrProgressWrap');
    const progressBar = document.getElementById('ocrProgressBar');
    const errorAlert = document.getElementById('errorAlert');
    const successAlert = document.getElementById('successAlert');
    const form = document.getElementById('reportForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');

    // تأثيرات السحب والإفلات
    ['dragenter', 'dragover'].forEach(name => {
      ocrBox.addEventListener(name, (e) => { e.preventDefault(); ocrBox.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      ocrBox.addEventListener(name, (e) => { e.preventDefault(); ocrBox.classList.remove('dragover'); });
    });

    // معالجة فحص الإيصال بسلاسة مع مؤشر التقدم
    receiptInput.addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file) return;

      ocrSub.innerText = file.name;
      ocrStatus.className = "ocr-status processing";
      ocrStatus.innerHTML = `<span>جاري قراءة البيانات من الإيصال...</span>`;
      progressWrap.style.display = 'block';
      progressBar.style.width = '15%';

      try {
        const worker = await Tesseract.createWorker('ara+eng', 1, {
          logger: m => {
            if (m.status === 'recognizing text') {
              const p = Math.round(m.progress * 100);
              progressBar.style.width = `${Math.max(15, p)}%`;
            }
          }
        });

        const ret = await worker.recognize(file);
        const text = ret.data.text;
        await worker.terminate();

        progressBar.style.width = '100%';

        // استخراج المبلغ
        const amountMatch = text.match(/([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]+)?|[0-9]+(?:\.[0-9]+)?)\s*(?:SDG|ج\.س|جنيه)/i) || 
                            text.match(/(?:المبلغ|Amount)[:\s]*([0-9,.]+)/i);
        if (amountMatch) {
          const rawAmount = amountMatch[1].replace(/,/g, '');
          if (!isNaN(rawAmount) && parseFloat(rawAmount) > 0) {
            const amtElem = document.getElementById('amount');
            amtElem.value = parseFloat(rawAmount);
            highlightField(amtElem);
          }
        }

        // استخراج الرقم المرجعي
        const refMatch = text.match(/(?:Ref|TRX|المرجعي|رقم العملية|Reference)[:\s#]*([0-9]{6,16})/i) || 
                         text.match(/\b([0-9]{10,14})\b/);
        if (refMatch) {
          const refElem = document.getElementById('refId');
          refElem.value = refMatch[1];
          highlightField(refElem);
        }

        setTimeout(() => {
          progressWrap.style.display = 'none';
          ocrStatus.className = "ocr-status success";
          ocrStatus.innerHTML = `<span>تم الفحص واستخراج البيانات بنجاح ✅</span>`;
        }, 400);

      } catch (err) {
        console.error("OCR Error:", err);
        progressWrap.style.display = 'none';
        ocrStatus.className = "ocr-status error";
        ocrStatus.innerHTML = `<span>تعذر استخراج النص تلقائياً، يرجى كتابتها يدوياً.</span>`;
      }
    });

    // وميض حركي للحقل الذي تمت تعبئته آلياً
    function highlightField(el) {
      el.style.borderColor = 'var(--success)';
      el.style.boxShadow = '0 0 0 3px var(--success-glow)';
      setTimeout(() => {
        el.style.borderColor = '';
        el.style.boxShadow = '';
      }, 1500);
    }

    // تجزئة رقم المعاملة (SHA-256)
    async function hashTransaction(refId) {
      const msgUint8 = new TextEncoder().encode(refId.trim());
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // إرسال البلاغ
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      errorAlert.style.display = 'none';
      successAlert.style.display = 'none';

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.innerText = "جاري التحقق والتأكيد...";

      const bank = document.getElementById('bankName').value;
      const ref = document.getElementById('refId').value.trim();
      const amountVal = parseFloat(document.getElementById('amount').value);
      const dateVal = document.getElementById('txDate').value;
      const phoneVal = document.getElementById('contactPhone').value.trim();

      try {
        const txHash = await hashTransaction(ref);
        const refCode = "RJ-" + Math.random().toString(36).substring(2, 6).toUpperCase() + "-" + Math.random().toString(36).substring(2, 6).toUpperCase();

        const { error } = await supabaseClient
          .from('transfer_reports')
          .insert([
            {
              report_type: 'sent',
              bank_text: bank,
              transaction_hash: txHash,
              amount: amountVal,
              transaction_date: dateVal,
              phone_encrypted: phoneVal,
              ref_code: refCode,
              status: 'pending'
            }
          ]);

        if (error) throw error;

        successAlert.style.display = 'block';
        successAlert.innerHTML = `<strong>تم تسجيل البلاغ بنجاح!</strong><br>كود المتابعة الخاص بك: <strong style="color:#fff; text-decoration: underline;">${refCode}</strong>`;
        form.reset();
        dateInput.value = today;
        ocrStatus.style.display = 'none';
        ocrSub.innerText = "اسحب صورة الإيصال هنا أو اضغط للاختيار (PNG/JPG)";
      } catch (err) {
        console.error("Save Error:", err);
        errorAlert.style.display = 'block';
        errorAlert.innerText = "حدث خطأ أثناء حفظ البلاغ في السيرفر. يرجى مراجعة الاتصال وإعادة المحاولة.";
      } finally {
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.innerText = "تسجيل وتأكيد البلاغ";
      }
    });
  </script>
</body>
</html>
